# ============================================================================
# AI tools declaration
# ============================================================================
ai_tools_used:
  - "Claude"        
ai_usage_summary: |
  Claude AI was used strategically for non-core engineering tasks:
  
  1. PPT Visualizations & Slide Design — Claude helped structure the 
     presentation deck layout, visual hierarchy, and infographic design 
     for clarity (not technical content generation).
  
  2. Streamlit App Structure — Claude suggested UI patterns for file 
     uploader, dataframe display, and temp file handling; I implemented 
     and tested all code.
  
  3. Documentation & README — Claude helped articulate the complex scoring 
     methodology clearly so judges can understand the algorithm without 
     ambiguity. The algorithm itself is entirely my design.
  
  4. Code Review & Edge Cases — Claude reviewed rank.py and identified 
     3 gaps (null checks, malformed data, CSV format validation). I 
     manually implemented all fixes and tested them.
  
  5. Reasoning Template Phrasing — Claude suggested varied wording patterns 
     for candidate explanations to avoid robotic repetition. I kept all 
     template logic, variable selection, and fact extraction entirely mine.
  
  NO candidate data was fed to any LLM. Core algorithm (scoring weights, 
  honeypot heuristics, ranking logic) is 100% original work.

# ============================================================================
# Approach summary
# ============================================================================
methodology_summary: |

  Deterministic, offline candidate ranker with rule-based scoring across 
  8 weighted dimensions: career history text (25%), title/trajectory (22%), 
  trusted skills (17%), behavioral availability (5%), experience fit (10%), 
  product company context (9%), location/logistics (8%), and education (4%).
  
  Core innovation: Honeypot detection via 8 trap patterns (expert skills with 
  0 duration, AI keyword stuffing without production work, inconsistent salary 
  ranges, services-heavy without product evidence, etc.). Streaming JSONL parser 
  with bounded heap (~5,000-10,000 candidates) processes 100K candidates in 
  60-90 seconds on CPU with <50 MB memory.
  
  Every candidate receives a bespoke 2-sentence reasoning grounded in profile 
  data (no LLM generation, no hallucinations). Target honeypot rate: 5-7% in 
  top 100 (well below 10% disqualification threshold).

